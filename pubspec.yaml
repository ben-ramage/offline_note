name: offline_note

description: "Offline Note is a Flutter app that showcases the use of the Drift Database, Firebase Firestore & Firebase Storage."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  go_router: ^18.0.1

  firebase_core: ^4.15.0
  cloud_firestore: ^6.10.0
  firebase_storage: ^13.6.0

  image_picker: ^1.2.3
  flutter_image_compress: ^2.5.1
  image: ^4.10.1

  drift: ^2.35.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  uuid: ^4.6.0
  path_provider: ^2.1.6
  flutter_bloc: ^9.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  drift_dev: ^2.35.0
  build_runner: ^2.16.1

flutter:
  uses-material-design: true

  assets:
    - images/avataar_ben.png